<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>事業コンソール</title>
<style>
:root{
  --paper:#EDF1F3; --panel:#FAFBFC; --ink:#1B2733; --ink2:#4A5A68; --ink3:#7A8A97;
  --line:#C6D1D8; --line2:#DCE3E8; --wash:#E4E9ED;
  --indigo:#2D4A87; --indigo-ink:#fff; --indigo-soft:#D9E2F3;
  --amber:#B87A0C; --amber-soft:#F6E6BF; --amber-ink:#5E3F00;
  --green:#2B7556; --green-soft:#D4EADF;
  --red:#B03E32; --red-soft:#F4DAD6;
  --focus:#2D6AE3;
  --font:"BIZ UDPGothic","Yu Gothic UI","Hiragino Sans","Noto Sans JP","Meiryo UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12191F; --panel:#1A232B; --ink:#E3E9ED; --ink2:#A9B6C0; --ink3:#7C8B97;
    --line:#33424E; --line2:#27333D; --wash:#212C35;
    --indigo:#8FA9E6; --indigo-ink:#0F1822; --indigo-soft:#26365A;
    --amber:#E3A83A; --amber-soft:#4A3913; --amber-ink:#F5DDA2;
    --green:#5CC49A; --green-soft:#1E3F32;
    --red:#EA7A6D; --red-soft:#4A2622;
    --focus:#7FA6FF;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;font-feature-settings:"palt"}
a{color:var(--indigo)}
small,.sm{font-size:12px;color:var(--ink2)}
.muted{color:var(--ink2)}
.num{font-variant-numeric:tabular-nums;text-align:right}

#app{display:grid;grid-template-columns:184px minmax(0,1fr);min-height:100%}
#rail{background:var(--ink);color:#DDE5EA;padding:18px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
@media (prefers-color-scheme:dark){#rail{background:#0C1217}}
#rail .brand{padding:0 18px 16px;font-weight:700;font-size:15px;line-height:1.3;border-bottom:1px solid rgba(255,255,255,.14);margin-bottom:10px}
#rail .brand small{display:block;color:#93A3AF;font-weight:400;margin-top:4px}
#rail button.nav{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;color:inherit;text-align:left;padding:9px 18px;border-left:3px solid transparent}
#rail button.nav:hover{background:rgba(255,255,255,.07)}
#rail button.nav[aria-current="page"]{background:rgba(255,255,255,.12);border-left-color:#E3A83A;font-weight:700}
#rail .count{font-size:12px;min-width:20px;text-align:center;padding:0 6px;border-radius:9px;background:rgba(255,255,255,.14)}
#rail .count.claude{background:#E3A83A;color:#2A1C00;font-weight:700}
#rail .foot{margin-top:auto;padding:12px 18px 0;font-size:12px;color:#93A3AF;border-top:1px solid rgba(255,255,255,.14)}

#main{min-width:0;padding:0 28px 80px}
#top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 0 14px}
#top h1{font-size:24px;margin-right:auto}
.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--panel);padding:3px 10px;border-radius:12px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.status.ok i{background:var(--green)} .status.warn i{background:var(--amber)} .status.bad i{background:var(--red)}

.btn{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:5px;line-height:1.4}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--indigo-ink);font-weight:700}
.btn.claude{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink);font-weight:700}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none;color:var(--indigo)}
button.link{border:0;background:none;padding:0;color:var(--indigo);text-align:left;font-weight:700}
button.link:hover{text-decoration:underline}

.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--amber);background:var(--panel);padding:10px 14px;margin-bottom:12px;border-radius:0 5px 5px 0}
.banner.bad{border-left-color:var(--red)}
.banner p{margin:0;flex:1;min-width:240px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;min-width:0}
.panel>h2{font-size:15px;margin-bottom:10px;display:flex;align-items:baseline;gap:10px}
.panel>h2 small{font-weight:400}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.stack{display:grid;gap:14px;min-width:0;align-content:start}

.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--line);background:var(--panel);border-radius:6px;margin-bottom:14px}
.figures>div{padding:12px 18px;border-right:1px solid var(--line2)}
.figures>div:last-child{border-right:0}
.figures b{display:block;font-size:24px;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums}
.figures span{font-size:12px;color:var(--ink2)}
.figures .warnfig b{color:var(--red)} .figures .claudefig b{color:var(--amber)}

/* chevron flow */
.flow{display:flex;gap:0;margin:4px 0 6px}
.flow button{flex:1;min-width:0;border:0;padding:10px 6px 10px 20px;color:var(--ink);background:var(--indigo-soft);text-align:left;
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%,13px 50%);margin-left:-6px}
.flow button:first-child{margin-left:0;padding-left:12px;clip-path:polygon(0 0,calc(100% - 13px) 0,100% 50%,calc(100% - 13px) 100%,0 100%)}
.flow button:hover{filter:brightness(.96)}
.flow b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.flow span{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.flow button[data-n="0"]{background:var(--wash)}
.flow button[data-n="0"] b{color:var(--ink3)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line2)}
.list li:first-child{border-top:0}
.list .grow{flex:1;min-width:0}
.list .t{display:block;overflow-wrap:anywhere}
.empty{color:var(--ink2);padding:14px 0}

.pill{display:inline-block;font-size:12px;line-height:1.5;padding:0 8px;border-radius:3px;background:var(--wash);color:var(--ink2);white-space:nowrap}
.pill.indigo{background:var(--indigo-soft);color:var(--indigo)}
.pill.amber{background:var(--amber-soft);color:var(--amber-ink)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.red{background:var(--red-soft);color:var(--red)}
.tag{font-size:12px;color:var(--ink2);margin-right:8px}
.tag::before{content:"#"}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1}
.toolbar input[type=search],.toolbar input[type=text],.toolbar select{border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:5px;min-width:0}
.toolbar input[type=search]{width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);padding:2px 11px;border-radius:13px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:700}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;min-width:200px;display:grid;gap:4px;box-shadow:0 6px 24px rgba(0,0,0,.16)}
.pop label{display:flex;gap:8px;align-items:center}

/* tables */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:var(--wash);font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
th button{border:0;background:none;font-weight:inherit;color:inherit;padding:0}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--indigo-soft) 35%,transparent)}
td.num,th.num{text-align:right}
tr.retired td{color:var(--ink3)}
tr.retired .link{color:var(--ink3);text-decoration:line-through}

/* matrix (工程表) */
.matrix td,.matrix th{padding:0}
.matrix th{padding:8px 10px;text-align:center;border-left:1px solid var(--line2)}
.matrix th.who,.matrix td.who{text-align:left;padding:8px 12px;min-width:240px;border-left:0}
.matrix td.cellc{border-left:1px solid var(--line2);width:92px;height:46px;padding:0}
.matrix td.st{padding:8px 12px;min-width:170px;font-size:13px;border-left:1px solid var(--line2)}
.cell{display:flex;align-items:center;justify-content:center;width:100%;height:46px;border:0;background:none;font-size:12px;color:var(--ink3)}
.cell:hover{background:var(--indigo-soft)}
.cell.done{background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.cell.now{background:var(--indigo);color:var(--indigo-ink);font-weight:700}
.cell.now.late{background:var(--red);color:#fff}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-bottom:12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.legend div{padding:9px 12px;border-right:1px solid var(--line2);font-size:12px;color:var(--ink2)}
.legend div:last-child{border-right:0}
.legend b{display:block;color:var(--ink);font-size:13px}

/* tasks board */
.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:12px;align-items:start}
.col{background:var(--wash);border-radius:6px;padding:10px;min-height:160px}
.col.over{outline:2px dashed var(--indigo)}
.col>h2{font-size:13px;margin:0 2px 8px;display:flex;justify-content:space-between}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.card.high{border-left-color:var(--red)} .card.mid{border-left-color:var(--indigo)}
.card.dragging{opacity:.4}
.card .ct{display:block;font-weight:700;margin-bottom:4px;overflow-wrap:anywhere;text-align:left}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2)}
.card.done .ct{color:var(--ink3);text-decoration:line-through}
.card .result{margin-top:6px;font-size:12px;color:var(--ink2);border-top:1px dashed var(--line);padding-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* tools */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.tool{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tool header{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tool p{margin:0;font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tool footer{margin-top:auto;font-size:12px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}

/* intel */
.capture{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;padding:12px;border:1px dashed var(--ink3);border-radius:6px;background:var(--panel)}
.capture input{flex:1;min-width:240px;border:1px solid var(--line);background:var(--paper);padding:7px 10px;border-radius:5px}
.capture select{border:1px solid var(--line);background:var(--paper);padding:7px;border-radius:5px}
.rows{border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.rows .row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line2);align-items:start}
.rows .row:first-child{border-top:0}
.rows .row p{margin:2px 0 0;font-size:13px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rows .side{text-align:right;font-size:12px;color:var(--ink2);display:grid;gap:2px;justify-items:end}
.rate{letter-spacing:2px;color:var(--amber)}

/* claude page */
.steps{margin:0;padding-left:1.3em}
.steps li{margin:4px 0}
.cmd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:6px 10px;margin:6px 0}
.cmd code{flex:1;min-width:200px;font-family:ui-monospace,Consolas,monospace;font-size:13px;overflow-wrap:anywhere}
.log{max-height:300px;overflow:auto;font-size:13px}
.log div{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line2)}
.log time{color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* drawer + modal */
#scrim{position:fixed;inset:0;background:rgba(10,18,24,.4);opacity:0;pointer-events:none;transition:opacity .15s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:31;transform:translateX(102%);transition:transform .18s ease-out;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .dh{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
#drawer .dh h2{flex:1;font-size:17px;overflow-wrap:anywhere}
#drawer .db{flex:1;overflow:auto;padding:14px 18px 24px}
#drawer .df{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--wash)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:grid;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--paper);padding:6px 9px;border-radius:5px;min-width:0}
.fld textarea{resize:vertical;line-height:1.55}
.sec{margin-top:18px}
.sec>h3{font-size:13px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.stagechips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.stagechips button{border:1px solid var(--line);background:var(--paper);padding:2px 10px;border-radius:3px;font-size:13px}
.stagechips button.on{background:var(--indigo);border-color:var(--indigo);color:var(--indigo-ink);font-weight:700}
.stagechips button.out.on{background:var(--ink3);border-color:var(--ink3)}
.check{display:flex;gap:8px;align-items:center;padding:3px 0}
.check span{flex:1}
.check.done span{color:var(--ink3);text-decoration:line-through}
.addline{display:flex;gap:6px;margin-top:6px}
.addline input{flex:1;border:1px solid var(--line);background:var(--paper);padding:5px 9px;border-radius:5px}
#modal-root .ms{position:fixed;inset:0;background:rgba(10,18,24,.5);z-index:40}
#modal-root form{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px 20px}
#modal-root h2{font-size:17px;margin-bottom:12px}
.tpls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;display:grid;gap:8px;justify-items:center}
.toast{background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;display:flex;gap:12px;align-items:center;max-width:min(560px,92vw);font-size:13px}
.toast button{border:1px solid currentColor;background:none;border-radius:4px;padding:0 8px;font-size:12px}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:0}
  #rail .brand,#rail .foot{display:none}
  #rail button.nav{width:auto;white-space:nowrap;gap:8px;border-left:0;border-bottom:3px solid transparent;padding:12px 14px}
  #rail button.nav[aria-current="page"]{border-bottom-color:#E3A83A}
  #main{padding:0 14px 80px}
  .board{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .rows .row{grid-template-columns:1fr}
  .rows .side{justify-items:start;text-align:left}
}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}

</style>
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="メイン"></nav>
  <div id="main">
    <header id="top"></header>
    <div id="banner"></div>
    <main id="view"></main>
  </div>
</div>
<div id="scrim" data-act="closeDrawer"></div>
<aside id="drawer" aria-hidden="true" aria-label="詳細"></aside>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

/* ---------- data: normalize / merge ---------- */
function normalize(d) {
  d = d && typeof d === 'object' ? d : {};
  if (!d.schema) d.schema = 1;
  d.meta = Object.assign({ name: '事業コンソール', stages: [...DEFAULT_STAGES], decisionDays: 60 }, d.meta || {});
  if (!Array.isArray(d.meta.stages) || !d.meta.stages.length) d.meta.stages = [...DEFAULT_STAGES];
  ['products', 'tasks', 'tools', 'intel', 'log', 'deleted'].forEach(c => { if (!Array.isArray(d[c])) d[c] = []; });
  const fix = (arr, p) => arr.forEach(x => {
    if (!x.id) x.id = uid(p);
    if (!x.updatedAt) x.updatedAt = x.createdAt || nowIso();
    if (!x.createdAt) x.createdAt = x.updatedAt;
  });
  fix(d.products, 'p'); fix(d.tasks, 't'); fix(d.tools, 'k'); fix(d.intel, 'i');
  d.products.forEach(p => {
    if (!Array.isArray(p.checklist)) p.checklist = [];
    p.sales = Number(p.sales) || 0; p.revenue = Number(p.revenue) || 0; p.price = Number(p.price) || 0;
    if (!p.currency) p.currency = p.market === 'EN' ? 'USD' : 'JPY';
    if (!p.stage) p.stage = d.meta.stages[0];
    ['name', 'kind', 'market', 'channel', 'url', 'listedAt', 'niche', 'folder', 'notes'].forEach(k => { if (p[k] == null) p[k] = ''; });
  });
  d.tasks.forEach(t => {
    if (!t.status) t.status = 'todo'; if (!t.assignee) t.assignee = 'me';
    if (!t.priority) t.priority = 'mid'; if (!t.kind) t.kind = 'other';
    ['due', 'ref', 'notes', 'result', 'title'].forEach(k => { if (t[k] == null) t[k] = ''; });
  });
  d.tools.forEach(k => {
    if (!k.status) k.status = '気になる'; if (!k.category) k.category = 'その他';
    ['url', 'cost', 'pros', 'cons', 'affiliate', 'notes', 'name'].forEach(f => { if (k[f] == null) k[f] = ''; });
  });
  d.intel.forEach(i => {
    if (!Array.isArray(i.tags)) i.tags = [];
    if (!i.status) i.status = '新着'; if (!i.type) i.type = 'メモ'; if (!i.source) i.source = 'me';
    i.rating = Number(i.rating) || 0;
    ['url', 'summary', 'notes', 'title'].forEach(f => { if (i[f] == null) i[f] = ''; });
  });
  return d;
}

function merge(local, remote) {
  const out = JSON.parse(JSON.stringify(remote));
  const tomb = new Map();
  [...(local.deleted || []), ...(remote.deleted || [])].forEach(x => tomb.set(x.id, x));
  out.deleted = [...tomb.values()].slice(-300);
  DATACOLS.forEach(c => {
    const m = new Map((remote[c] || []).map(x => [x.id, x]));
    (local[c] || []).forEach(x => {
      const r = m.get(x.id);
      if (!r || ts(x.updatedAt) > ts(r.updatedAt)) m.set(x.id, JSON.parse(JSON.stringify(x)));
    });
    out[c] = [...m.values()].filter(x => !tomb.has(x.id));
  });
  const seen = new Set();
  out.log = [...(remote.log || []), ...(local.log || [])].filter(l => {
    const k = l.at + '|' + l.who + '|' + l.text; if (seen.has(k)) return false; seen.add(k); return true;
  }).sort((a, b) => ts(a.at) - ts(b.at)).slice(-300);
  return out;
}

/* ---------- persistence ---------- */
let _idb;
function idb() {
  if (_idb) return _idb;
  _idb = new Promise((res, rej) => {
    const r = indexedDB.open('biz-console', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _idb;
}
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbDel(k) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }

async function writeNow() {
  const w = await S.fh.createWritable();
  await w.write(JSON.stringify(S.data, null, 2) + '\n');
  await w.close();
  const f = await S.fh.getFile();
  S.lastMod = f.lastModified; S.savedAt = Date.now();
}

async function useDir(dir) {
  const dataDir = await dir.getDirectoryHandle('data', { create: true });
  const fh = await dataDir.getFileHandle('biz.json', { create: true });
  const f = await fh.getFile();
  const text = await f.text();
  S.dir = dir; S.fh = fh; S.dirName = dir.name; S.lastMod = f.lastModified; S.pendingDir = null; S.bad = 0;
  if (text.trim()) {
    try { S.data = normalize(JSON.parse(text)); S.conn = 'connected'; S.err = ''; }
    catch (e) { S.conn = 'error'; S.err = badJsonMessage(); if (!S.data) S.data = seedData(); }
  } else {
    S.conn = 'connected'; S.err = '';
    if (!S.data) S.data = seedData();
    await writeNow();
  }
  startPolling();
  renderAll();
}
const badJsonMessage = () => 'data/biz.json のJSONが壊れています。Claude Codeに「data/biz.json のJSONを修復して」と頼むか、ファイルを確認してください。直るとこの画面が自動で復帰します。';

async function forgetFolder() {

let _saveTimer;
function scheduleSave() { clearTimeout(_saveTimer); _saveTimer = setTimeout(save, 300); }
async function save() {
  if (S.saving) { S.again = true; return; }
  if (!S.fh) {
    try { localStorage.setItem('biz-demo', JSON.stringify(S.data)); } catch (e) { /* ignore */ }
    S.dirty = false; S.savedAt = Date.now(); renderTop(); return;
  }
  if (S.conn !== 'connected') return;
  S.saving = true;
  const rev = S.rev; let merged = false;
  try {
    const f = await S.fh.getFile();
    if (f.lastModified !== S.lastMod) {
      let remote;
      try { remote = normalize(JSON.parse(await f.text())); }
      catch (e) { S.saving = false; setTimeout(save, 1200); return; }
      S.data = merge(S.data, remote); merged = true;
    }
    await writeNow();
    if (S.rev === rev) S.dirty = false; else S.again = true;
  } catch (e) { toast('保存に失敗しました: ' + e.message); }
  S.saving = false;
  if (merged) renderAll({ keepDrawer: editingInDrawer() }); else renderTop();
  if (S.again) { S.again = false; scheduleSave(); }
}

function startPolling() { if (!S.poll) S.poll = setInterval(pollOnce, 1500); }
async function pollOnce() {
  if (!S.fh || S.saving) return;
  try {
    const f = await S.fh.getFile();
    if (f.lastModified === S.lastMod) return;
    let remote;
    try { remote = normalize(JSON.parse(await f.text())); }
    catch (e) {
      if (++S.bad >= 2 && S.conn === 'connected') { S.conn = 'error'; S.err = badJsonMessage(); renderTop(); renderBanner(); }
      return;
    }
    S.bad = 0; S.conn = 'connected'; S.err = ''; S.lastMod = f.lastModified;
    const before = JSON.stringify(S.data);
    if (S.dirty) { S.data = merge(S.data, remote); scheduleSave(); } else S.data = remote;
    if (JSON.stringify(S.data) !== before) { renderAll({ keepDrawer: editingInDrawer() }); toast('ファイルの更新を画面に反映しました'); }
    else { renderTop(); renderBanner(); }
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'NotFoundError' || e.name === 'SecurityError')) {
      clearInterval(S.poll); S.poll = null; S.pendingDir = S.dir; S.fh = null; S.conn = 'needs-permission';
      renderTop(); renderBanner();
    }
  }
}
function editingInDrawer() {

function logAdd(text, who) {
  D().log.push({ at: nowIso(), who: who || 'me', text });
  if (D().log.length > 300) D().log.splice(0, D().log.length - 300);
}
const touchItem = it => { it.updatedAt = nowIso(); };
function commit(opts) {
  D().meta.updatedAt = nowIso(); S.rev++; S.dirty = true; scheduleSave(); renderAll(opts);
}
function removeItem(col, id) {
  const arr = D()[col], i = arr.findIndex(x => x.id === id);
  if (i < 0) return;
  const it = arr.splice(i, 1)[0];
  D().deleted.push({ id, at: nowIso() });
  logAdd(`${COLNAME[col]}「${titleOf(it)}」を削除`);
  if (S.drawer && S.drawer.id === id) S.drawer = null;
  commit();
}
function needsDecision(p) {
  if (p.stage === '撤退') return false;
  const d = daysSince(p.listedAt);
  return d != null && d >= D().meta.decisionDays && !(p.sales > 0);
}
function setStage(p, st) {
  if (p.stage === st) return;
  const old = p.stage; p.stage = st; p.stageAt = today();
  const i = stages().indexOf(st), li = stages().indexOf('出品');
  if (li >= 0 && i >= li && !p.listedAt) p.listedAt = today();
  touchItem(p); logAdd(`「${p.name}」: ${old} → ${st}`); commit();
}
function setTaskStatus(id, st) {
  const t = byId('tasks', id); if (!t || t.status === st) return;
  t.status = st; if (st === 'done') t.doneAt = nowIso(); else delete t.doneAt;
  touchItem(t); logAdd(`タスク「${t.title}」→ ${(TASK_STATUS.find(x => x[0] === st) || [])[1]}`); commit();
}

  D().tasks.push(t);

}

const optList = o => (o || []).map(x => Array.isArray(x) ? x : [x, x]);
function fieldHtml(f, v, mode) {
  v = v == null ? '' : v;
  const attr = mode === 'form' ? `name="${f.k}"` : `data-f="${f.k}"${f.type === 'number' || f.num ? ' data-t="number"' : ''}${f.type === 'tags' ? ' data-t="tags"' : ''}`;
  let input;
  if (f.type === 'select') {
    let list = optList(f.options);
    if (v !== '' && !list.some(([a]) => String(a) === String(v))) list = [[v, v], ...list];
    input = `<select ${attr}>${list.map(([a, l]) => `<option value="${esc(a)}"${String(a) === String(v) ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  } else if (f.type === 'textarea') {
    input = `<textarea ${attr} rows="${f.rows || 4}" placeholder="${esc(f.ph || '')}">${esc(v)}</textarea>`;
  } else if (f.type === 'tags') {
    input = `<input type="text" ${attr} value="${esc((v || []).join(', '))}" placeholder="カンマ区切り">`;
  } else {

}

function stateText(p) {
  if (p.stage === '撤退') return '<span class="muted">撤退</span>';
  const d = daysSince(p.listedAt);
  if (needsDecision(p)) return `<b style="color:var(--red)">判断日です</b><br><small>出品から${d}日・販売0</small>`;
  if (d != null) return `出品から${d}日<br><small>販売 ${p.sales} / ${fmtMoney(p.revenue, p.currency)}</small>`;
  return '<small class="muted">未出品</small>';
}
function vPipeline() {
  const st = stages(), f = S.f;
  let list = D().products.filter(p => (f.showRetired || p.stage !== '撤退') && (!f.pmarket || p.market === f.pmarket));
  const rank = p => p.stage === '撤退' ? -1 : st.indexOf(p.stage);
  list = list.sort((a, b) => rank(b) - rank(a) || a.name.localeCompare(b.name, 'ja'));
  const head = `<tr><th class="who">商品</th>${st.map(s => `<th>${esc(s)}</th>`).join('')}<th>状態</th></tr>`;
  const rows = list.map(p => {
    const idx = st.indexOf(p.stage), late = needsDecision(p);
    const cells = st.map((s, i) => {
      const cls = p.stage === '撤退' ? '' : i < idx ? 'done' : i === idx ? 'now' + (late ? ' late' : '') : '';
      const dd = i === idx ? daysSince(p.stageAt) : null;
      const label = i < idx ? '✓' : i === idx ? (dd != null ? dd + '日' : '●') : '';
      return `<td class="cellc"><button class="cell ${cls}" data-act="setStage" data-id="${p.id}" data-stage="${esc(s)}" aria-label="${esc(p.name)}を${esc(s)}にする">${label}</button></td>`;
    }).join('');
    return `<tr class="${p.stage === '撤退' ? 'retired' : ''}"><td class="who"><button class="link" data-act="open" data-col="products" data-id="${p.id}">${esc(p.name)}</button><br><small>${esc(p.market)} · ${esc(p.kind)}${p.channel ? ' · ' + esc(p.channel) : ''}</small></td>${cells}<td class="st">${stateText(p)}</td></tr>`;
  }).join('');
  const legend = `<div class="legend">${st.map(s => `<div><b>${esc(s)}</b>${esc(STAGE_HINT[s] || '')}</div>`).join('')}</div>`;
  const tb = `<div class="toolbar"><div class="chips">${[['', 'すべて'], ['JP', 'JP'], ['EN', 'EN']].map(([v, l]) => `<button class="chip" aria-pressed="${f.pmarket === v}" data-act="filter" data-k="pmarket" data-v="${v}">${l}</button>`).join('')}</div>

    <small>マス目を押すと、その工程に移ります。</small><button class="btn primary" data-act="addProduct">商品を追加</button></div>`;
  return tb + legend + (list.length ? `<div class="tablewrap"><table class="matrix"><thead>${head}</thead><tbody>${rows}</tbody></table></div>` : '<p class="empty">商品がありません。「商品を追加」から始めましょう。</p>');
}

/* ---------- render ---------- */
function connStatus() {
  if (S.conn === 'connected') return { cls: S.dirty ? 'warn' : 'ok', text: S.dirty ? '保存中…' : `${S.dirName}/data/biz.json に保存済み${S.savedAt ? ' ' + hhmm(S.savedAt) : ''}` };
  if (S.conn === 'needs-permission') return { cls: 'warn', text: 'フォルダへの再接続が必要です' };
  if (S.conn === 'error') return { cls: 'bad', text: 'データを読み込めません' };
  if (S.conn === 'unsupported') return { cls: 'warn', text: 'このブラウザはフォルダ接続に非対応' };
  return { cls: 'warn', text: S.dirty ? '保存中…' : 'フォルダ未接続(このブラウザ内だけに保存)' };
}
function renderRail() {
  const n = {
    products: D().products.filter(p => p.stage !== '撤退').length,
    tasks: D().tasks.filter(t => t.status !== 'done' && t.assignee === 'me').length,
    intel: D().intel.filter(i => i.status === '新着').length,
    claude: claudeQueue('todo').length
  };
  $('#rail').innerHTML = `<div class="brand">${esc(D().meta.name)}<small>Claude Codeと同じデータを見ます</small></div>` +
    Object.keys(VIEWS).map(v => `<button class="nav" data-act="nav" data-v="${v}"${S.view === v ? ' aria-current="page"' : ''}><span>${VIEW_LABEL[v]}</span>${n[v] ? `<span class="count${v === 'claude' ? ' claude' : ''}">${n[v]}</span>` : ''}</button>`).join('') +
    `<div class="foot">更新 ${esc(fmtTime(D().meta.updatedAt))}</div>`;
}
function renderTop() {
  const st = connStatus();
  $('#top').innerHTML = `<h1>${esc(VIEW_LABEL[S.view])}</h1><span class="status ${st.cls}"><i></i>${esc(st.text)}</span><button class="btn claude" data-act="askClaude" data-ref="">Claudeに依頼</button>`;
}
function renderBanner() {
  let h = '';
  if (S.conn === 'needs-permission') h += `<div class="banner"><p>前回のフォルダ「${esc(S.pendingDir ? S.pendingDir.name : '')}」に再接続します。ブラウザの安全のため、開くたびに1回の許可が必要です。</p><button class="btn primary" data-act="reconnect">再接続する</button></div>`;
  else if (S.conn === 'unsupported') h += '<div class="banner"><p>このブラウザはフォルダ接続に対応していません。Chrome か Edge で開いてください。いまはこのブラウザ内にだけ保存されます。</p></div>';
  else if (S.conn === 'demo') h += '<div class="banner"><p>プロジェクトのフォルダを接続すると、Claude Codeと同じデータ(data/biz.json)を読み書きできます。いまはこのブラウザ内にだけ保存されます。</p><button class="btn primary" data-act="connect">フォルダを接続</button></div>';

  if (hasSample()) h += '<div class="banner"><p>サンプルデータが入っています。操作を試してから、不要になったら削除してください。</p><button class="btn" data-act="clearSample">サンプルをすべて削除</button></div>';
  $('#banner').innerHTML = h;
}
function renderView() {
  const ae = document.activeElement;
  const keep = ae && ae.dataset && ae.dataset.keep ? { id: ae.dataset.keep, s: ae.selectionStart, e: ae.selectionEnd } : null;
  $('#view').innerHTML = VIEWS[S.view]();
  if (keep) {
    const el = $(`[data-keep="${keep.id}"]`);
    if (el) { el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* select */ } }
  }
}
function renderDrawer() {
  const dr = $('#drawer'), sc = $('#scrim');
  const it = S.drawer && byId(S.drawer.col, S.drawer.id);
  if (!it) {
    S.drawer = null; dr.classList.remove('on'); sc.classList.remove('on'); dr.setAttribute('aria-hidden', 'true'); dr.innerHTML = ''; return;
  }
  const old = $('#drawer .db'), top = old ? old.scrollTop : 0;
  dr.innerHTML = DRAWERS[S.drawer.col](it);
  dr.classList.add('on'); sc.classList.add('on'); dr.setAttribute('aria-hidden', 'false');
  const nb = $('#drawer .db'); if (nb) nb.scrollTop = top;
}
function renderAll(opts) {
  renderRail(); renderTop(); renderBanner(); renderView();
  if (!(opts && opts.keepDrawer)) renderDrawer();
}

/* ---------- toast / copy ---------- */
function toast(msg, action) {
  const root = $('#toasts'); if (!root) return;
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); el.remove(); }; el.appendChild(b); }
  root.appendChild(el); setTimeout(() => el.remove(), action ? 9000 : 4000);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e2) { /* ignore */ } ta.remove(); }
  toast('コピーしました: ' + (t.length > 36 ? t.slice(0, 36) + '…' : t));
}

/* ---------- actions ---------- */
const ACTIONS = {
  nav(el) { S.view = el.dataset.v; S.drawer = null; S.colMenu = false; renderAll(); window.scrollTo && window.scrollTo(0, 0); },
  goStage(el) { S.f.pstage = el.dataset.stage; S.view = 'products'; renderAll(); },
  open(el) { S.drawer = { col: el.dataset.col, id: el.dataset.id }; renderDrawer(); },
  closeDrawer() { S.drawer = null; renderDrawer(); },
  closeModal() { closeModal(); },
  setStage(el) { const p = byId('products', el.dataset.id); if (p) setStage(p, el.dataset.stage); },
  retire(el) { const p = byId('products', el.dataset.id); if (p && confirm(`「${p.name}」を撤退にします。よろしいですか?`)) setStage(p, '撤退'); },
  toggleDone(el) { setTaskStatus(el.dataset.id, el.checked ? 'done' : 'todo'); },
  markDone(el) { setTaskStatus(el.dataset.id, 'done'); },
  toggleCheck(el) { const p = byId('products', el.dataset.id); if (!p) return; const c = p.checklist[+el.dataset.i]; c.done = !c.done; touchItem(p); commit(); },
  delCheck(el, e) { e.preventDefault(); const p = byId('products', el.dataset.id); if (!p) return; p.checklist.splice(+el.dataset.i, 1); touchItem(p); commit(); },
  defaultCheck(el) { const p = byId('products', el.dataset.id); if (!p) return; p.checklist = CHECK_DEFAULT.map(text => ({ text, done: false })); touchItem(p); commit(); },
  del(el) { const it = byId(el.dataset.col, el.dataset.id); if (it && confirm(`「${titleOf(it)}」を削除します。元に戻せません。よろしいですか?`)) removeItem(el.dataset.col, el.dataset.id); },
  filter(el) { S.f[el.dataset.k] = el.dataset.v; renderView(); },
  toggleRetired() { S.f.showRetired = !S.f.showRetired; renderView(); },
  sort(el) { const k = el.dataset.k, s = S.f.psort; S.f.psort = s.k === k ? { k, dir: -s.dir } : { k, dir: 1 }; renderView(); },
  colMenu() { S.colMenu = !S.colMenu; renderView(); },
  addProduct() { addProductForm(); },
  addTask(el) { addTaskForm(el.dataset.ref || ''); },
  addTool() { addToolForm(); },
  scoutTools() { scoutToolsForm(); },
  askClaude(el) { askClaudeForm(el.dataset.ref || '', el.dataset.tpl || ''); },
  researchTool(el) {
    const k = byId('tools', el.dataset.id); if (!k) return;
    createTask({ assignee: 'claude', kind: 'research', priority: 'mid', title: `ツールを調べる: ${k.name}`, ref: 'tool:' + k.id, notes: `${k.name} の料金・手数料・規約上の注意・代替を最新情報で確認し、このツールの cost / pros / cons / affiliate / notes を更新してください。出典URLと確認日を notes に書いてください。` });
    toast('Claudeへの依頼を追加しました', { label: PROMPT_QUEUE + ' をコピー', fn: () => copyText(PROMPT_QUEUE) });
  },
  applyTpl(el) {
    const t = TEMPLATES.find(x => x.key === el.dataset.key), f = $('#mform'); if (!t || !f) return;
    Object.entries(t.fill).forEach(([k, v]) => { if (f.elements[k]) f.elements[k].value = v; });
  },
  capture() { captureIntel(); },
  triageIntel() {
    const n = D().intel.filter(i => i.status === '新着').length;
    if (D().tasks.some(t => t.title === '新着の情報を整理する' && t.status !== 'done')) { toast('同じ依頼がすでにあります'); return; }
    createTask({ assignee: 'claude', kind: 'research', priority: 'mid', title: '新着の情報を整理する', notes: `intel のうち status=新着 の ${n} 件を読み、summary(要点)・tags・rating(使える度1〜3)・type を埋めてください。URLがあるものは内容を確認し、確認できなかったものは summary に「未確認」と書いてください。整理できたものは status を 確認済 にしてください。` });
    toast('Claudeへの依頼を追加しました', { label: PROMPT_QUEUE + ' をコピー', fn: () => copyText(PROMPT_QUEUE) });
  },
  copy(el) { copyText(el.dataset.text); },
  connect() { connectFolder(); },
  reconnect() { reconnectFolder(); },
  forget() { forgetFolder(); },
  export() {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(D(), null, 2)], { type: 'application/json' }));
    a.download = `biz-${today().replace(/-/g, '')}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  },
  import() { $('#importer').click(); },
  clearSample() {
    if (!confirm('サンプルのデータ(商品・タスク・ツール・情報)をすべて削除します。よろしいですか?')) return;
    let n = 0;
    DATACOLS.forEach(c => { D()[c] = D()[c].filter(x => { if (x.sample) { D().deleted.push({ id: x.id, at: nowIso() }); n++; return false; } return true; }); });
    S.drawer = null; logAdd(`サンプルデータ ${n} 件を削除`); commit();
  }
};

function captureIntel() {
  const inp = $('[data-capture]'), sel = $('[data-capture-type]'); if (!inp) return;
  const v = inp.value.trim(); if (!v) { toast('URLかメモを入力してください'); return; }
  const isUrl = /^https?:\/\/\S+$/i.test(v); let title = v.slice(0, 60);
  if (isUrl) { try { title = new URL(v).hostname; } catch (e) { /* keep */ } }
  const it = { id: uid('i'), title, url: isUrl ? v : '', type: sel ? sel.value : 'メモ', summary: isUrl ? '' : v, notes: '', tags: [], rating: 0, status: '新着', source: 'me', createdAt: nowIso(), updatedAt: nowIso() };
  D().intel.push(it); logAdd(`情報を追加: ${it.title}`); commit();
  const again = $('[data-capture]'); if (again) again.focus();
  toast('保存しました。「Claudeに整理させる」で要点をまとめられます');
}

/* ---------- events ---------- */
function bindEvents() {
  document.addEventListener('click', e => {
    if (S.colMenu && !e.target.closest('.popwrap')) { S.colMenu = false; renderView(); }
    const a = e.target.closest('[data-act]'); if (!a) return;
    const fn = ACTIONS[a.dataset.act]; if (fn) fn(a, e);
  });
  document.addEventListener('change', e => {
    const c = e.target.closest('[data-col]');
    if (c && c.tagName === 'INPUT') { S.cols[c.dataset.col] = c.checked ? 1 : 0; try { localStorage.setItem('biz-cols', JSON.stringify(S.cols)); } catch (x) { /* ignore */ } renderView(); return; }
    const el = e.target.closest('[data-f]');
    if (el && S.drawer) {
      const it = byId(S.drawer.col, S.drawer.id); if (!it) return;
      const k = el.dataset.f, t = el.dataset.t; let v = el.value;
      if (t === 'number') v = v === '' ? 0 : Number(v);
      if (t === 'tags') v = v.split(/[,、]/).map(s => s.trim()).filter(Boolean);
      it[k] = v; touchItem(it);
      if (S.drawer.col === 'tasks' && k === 'status') { if (v === 'done') it.doneAt = nowIso(); else delete it.doneAt; logAdd(`タスク「${it.title}」→ ${(TASK_STATUS.find(x => x[0] === v) || [])[1]}`); }
      if (k === 'name' || k === 'title') { const h = $('#drawer .dt'); if (h) h.textContent = titleOf(it); }
      commit({ keepDrawer: true });
    }
    if (e.target.id === 'importer') {
      const file = e.target.files && e.target.files[0]; if (!file) return;
      file.text().then(txt => {
        let d; try { d = normalize(JSON.parse(txt)); } catch (x) { toast('JSONを読み込めませんでした'); return; }
        if (!confirm('現在のデータを、読み込んだファイルの内容で置き換えます。よろしいですか?')) return;
        S.data = d; S.drawer = null; logAdd('JSONを読み込み'); commit();
      });
      e.target.value = '';
    }
  });
  const applyFilter = e => {
    const fl = e.target.closest && e.target.closest('[data-filter]');
    if (fl) { S.f[fl.dataset.filter] = fl.value; renderView(); }
  };
  document.addEventListener('input', e => { if (!e.isComposing) applyFilter(e); });
  document.addEventListener('compositionend', applyFilter);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (S.modal) closeModal(); else if (S.drawer) { S.drawer = null; renderDrawer(); } return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const t = e.target;
    if (t.dataset && t.dataset.addcheck) {
      e.preventDefault(); const p = byId('products', t.dataset.addcheck), v = t.value.trim(); if (!p || !v) return;
      p.checklist.push({ text: v, done: false }); touchItem(p); commit();
      const n = $(`[data-addcheck="${p.id}"]`); if (n) n.focus();
    } else if (t.dataset && t.dataset.capture !== undefined) { e.preventDefault(); captureIntel(); }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'mform') return;
    e.preventDefault();
    const m = S.modal, fd = new FormData(e.target), vals = {};
    for (const f of m.fields) {
      let v = String(fd.get(f.k) == null ? '' : fd.get(f.k)).trim();
      if (f.required && !v) { toast(`${f.l}を入力してください`); return; }
      if (f.type === 'number') v = Number(v) || 0;
      vals[f.k] = v;
    }
    closeModal(); m.onSubmit(vals);
  });
  document.addEventListener('dragstart', e => {
    const c = e.target.closest && e.target.closest('.card[data-id]'); if (!c) return;
    e.dataTransfer.setData('text/plain', c.dataset.id); e.dataTransfer.effectAllowed = 'move'; c.classList.add('dragging');
  });
  document.addEventListener('dragend', () => { $$('.dragging').forEach(x => x.classList.remove('dragging')); $$('.col.over').forEach(x => x.classList.remove('over')); });
  document.addEventListener('dragover', e => {
    const c = e.target.closest && e.target.closest('.col[data-drop]');
    if (c) { e.preventDefault(); $$('.col.over').forEach(x => { if (x !== c) x.classList.remove('over'); }); c.classList.add('over'); }
  });
  document.addEventListener('drop', e => {
    const c = e.target.closest && e.target.closest('.col[data-drop]'); if (!c) return;
    e.preventDefault(); setTaskStatus(e.dataTransfer.getData('text/plain'), c.dataset.drop);
  });
  window.addEventListener('beforeunload', e => { if (S.dirty && S.fh) { e.preventDefault(); e.returnValue = ''; } });
}

/* ---------- init ---------- */
async function restore() {
  if (!window.showDirectoryPicker) { S.conn = 'unsupported'; return; }
  try {
    const dir = await idbGet('dir');
    if (dir) {
      const p = await dir.queryPermission({ mode: 'readwrite' });
      if (p === 'granted') { await useDir(dir); return; }
      S.pendingDir = dir; S.conn = 'needs-permission';
    }
  } catch (e) { /* fall back to demo */ }
}
async function init() {
  S.cols = loadCols(); S.data = loadDemo(); S.conn = 'demo';
  bindEvents();
  await restore();
  renderAll();
}
if (typeof window !== 'undefined') window.__biz = { S, normalize, merge, VIEWS, DRAWERS, ACTIONS, renderAll, createTask, needsDecision, seedData, useDir, save };
if (typeof window !== 'undefined' && !window.__BIZ_TEST__) init();

</script>
